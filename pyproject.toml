[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oarepo-tools"
version = "1.0.0"
description = "OARepo tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
authors = [{ name = "Miroslav Simek", email = "miroslav.simek@cesnet.cz" }]
# Kept light on purpose: oarepo-cli depends on this package at runtime
# (make-translations command), so no oarepo/invenio dependencies here.
dependencies = ["click", "polib", "jinja2", "babel", "PyYAML", "jinjax"]

[project.scripts]
make-translations = "oarepo_tools.make_translations:main"

[project.optional-dependencies]
tests = [
    "pytest",
]
oarepo14 = [
    "oarepo[rdm]>=14,<15",
]

[tool.hatch.build.targets.wheel]
packages = ["oarepo_tools"]

[tool.hatch.build.targets.sdist]
include = [
    "/oarepo_tools",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.oarepo-cli.services]
# Tests work on temporary directories only, no Docker services needed.
skip = true
