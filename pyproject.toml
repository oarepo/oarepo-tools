[project]
name = "oarepo-tools"
version = "0.2.5"
description = "OARepo tools"
readme = "README.md"
authors = [{ name = "Miroslav Simek", email = "miroslav.simek@cesnet.cz" }]
requires-python = ">=3.12"
dependencies = [
    "click",
    "polib",
    "jinja2",
    "babel",
    "PyYAML",
    "jinjax",
    "ruff",
    "licenseheaders",
    "mypy",
    "pyre-check",
    "setuptools",
    "pip",
    "wheel"
]

[project.scripts]
make-translations = "oarepo_tools.cli.make_translations:main"
format-sources = "oarepo_tools.cli.format:main"
check-sources = "oarepo_tools.cli.check:main"

[tool.setuptools]
# ...
# By default, include-package-data is true in pyproject.toml, so you do
# NOT have to specify this line.
include-package-data = true

[project.optional-dependencies]
dev = [
    "black",
    "autoflake",
    "isort",
]
tests = [
    "pytest>=7.1.2",
    "pytest-docker",
    "pytest>=7.1.2",
    "oarepo-runtime>=1.4.44",
    "pytest-mock",
    "pytest-invenio",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[tool.pytest]
testpaths = ['tests']
